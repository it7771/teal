SPRINT STATE
========================================================= */

function isSprintActive() {

    const sprintHeld =
        keys[keybinds.sprint];

    const sprintRequested =
        sprintMode === "toggle"
            ? sprintToggleState
            : sprintHeld;


    return (
        sprintRequested &&
        keys[keybinds.forward] &&
        !keys[keybinds.back]
    );

}


function isSlowWalkActive() {

    return (
        slowWalkMode === "toggle"
            ? slowWalkToggleState
            : Boolean(keys[keybinds.slowWalk])
    );

}


/* =========================================================
PLAYER LEAN
========================================================= */

function getLeanTarget() {

    if (isSprintActive()) {
        return 0;
    }


    if (leanMode === "toggle") {

        if (leanToggleLeft && !leanToggleRight) {
            return -1;
        }

        if (leanToggleRight && !leanToggleLeft) {
            return 1;
        }

        return 0;

    }


    const leftHeld =
        keys[keybinds.leanLeft];

    const rightHeld =
        keys[keybinds.leanRight];


    if (leftHeld && !rightHeld) {
        return -1;
    }


    if (rightHeld && !leftHeld) {
        return 1;
    }


    return 0;

}


function clearLeanVisualOffset() {

    if (leanWorldOffset.lengthSq() > 0) {

        camera.position.sub(
            leanWorldOffset
        );

        leanWorldOffset.set(
            0,
            0,
            0
        );

    }

}


function getSafeLeanOffset(
    desiredOffset,
    baseX,
    baseZ
) {

    if (
        desiredOffset.lengthSq() < 0.000001
    ) {

        return new THREE.Vector3();

    }


    const fullX =
        baseX + desiredOffset.x;

    const fullZ =
        baseZ + desiredOffset.z;


    if (!collidesAt(fullX, fullZ)) {
        return desiredOffset.clone();
    }


    let low = 0;
    let high = 1;


    for (let i = 0; i < 8; i++) {

        const mid =
            (low + high) / 2;

        const testX =
            baseX +
            desiredOffset.x *
            mid;

        const testZ =
            baseZ +
            desiredOffset.z *
            mid;

        if (collidesAt(testX, testZ)) {
            high = mid;
        } else {
            low = mid;
        }

    }


    return desiredOffset
        .clone()
        .multiplyScalar(low);

}


function getLeanProfileArea() {

    const phase1Time =
        Math.max(
            0.0001,
            leanPhase1Time
        );

    const phase2Time =
        Math.max(
            0.0001,
            leanPhase2Time
        );

    const phase3Time =
        Math.max(
            0.0001,
            leanPhase3Time
        );

    const phase1Area =
        phase1Time *
        (
            leanPhase1EndSpeed +
            (
                leanPhase1StartSpeed -
                leanPhase1EndSpeed
            ) / 3
        );

    const phase2Area =
        phase2Time *
        (
            leanPhase1EndSpeed +
            leanPhase2EndSpeed
        ) / 2;

    const brakePower =
        Math.max(
            1,
            leanPhase3BrakePower
        );

    const phase3Area =
        phase3Time *
        leanPhase2EndSpeed *
        (
            brakePower /
            (brakePower + 1)
        );

    return {
        phase1Time,
        phase2Time,
        phase3Time,
        phase1Area,
        phase2Area,
        phase3Area,
        totalArea:
            phase1Area +
            phase2Area +
            phase3Area
    };

}


function getLeanProfileProgress(
    elapsed
) {

    const profile =
        getLeanProfileArea();

    const totalTime =
        profile.phase1Time +
        profile.phase2Time +
        profile.phase3Time;

    const time =
        THREE.MathUtils.clamp(
            elapsed,
            0,
            totalTime
        );

    let traveledArea = 0;


    if (
        time <=
        profile.phase1Time
    ) {

        const u =
            time /
            profile.phase1Time;

        /*
        Phase 1 velocity:
        high at the start, then quickly softens.
        v(u) = end + (start - end) * (1-u)^2
        */
        const phase1Integral =
            profile.phase1Time *
            (
                leanPhase1EndSpeed * u +
                (
                    leanPhase1StartSpeed -
                    leanPhase1EndSpeed
                ) *
                (
                    u -
                    u * u +
                    (u * u * u) / 3
                )
            );

        traveledArea =
            phase1Integral;

    } else if (
        time <=
            profile.phase1Time +
            profile.phase2Time
    ) {

        const phase2TimeElapsed =
            time -
            profile.phase1Time;

        const u =
            phase2TimeElapsed /
            profile.phase2Time;

        const phase2SpeedDifference =
            leanPhase1EndSpeed -
            leanPhase2EndSpeed;

        /*
        Phase 2 velocity drops steadily from the end of
        Phase 1 to the low speed that enters Phase 3.
        */
        const phase2Integral =
            profile.phase2Time *
            (
                leanPhase1EndSpeed * u -
                (phase2SpeedDifference * u * u) / 2
            );

        traveledArea =
            profile.phase1Area +
            phase2Integral;

    } else {

        const phase3TimeElapsed =
            Math.min(
                profile.phase3Time,
                time -
                profile.phase1Time -
                profile.phase2Time
            );

        const u =
            phase3TimeElapsed /
            profile.phase3Time;

        const brakePower =
            Math.max(
                1,
                leanPhase3BrakePower
            );

        /*
        Phase 3 velocity remains near its incoming low speed
        at first, then drops sharply during the final ticks.
        v(u) = incomingSpeed * (1-u^power)
        */
        const phase3Integral =
            profile.phase3Time *
            leanPhase2EndSpeed *
            (
                u -
                Math.pow(
                    u,
                    brakePower + 1
                ) /
                (brakePower + 1)
            );

        traveledArea =
            profile.phase1Area +
            profile.phase2Area +
            phase3Integral;

    }


    return THREE.MathUtils.clamp(
        traveledArea /
        Math.max(
            0.0001,
            profile.totalArea
        ),
        0,
        1
    );

}


function updateLean(delta) {

    const targetLean =
        getLeanTarget();


    if (
        targetLean !==
        leanAnimationTarget
    ) {

        leanAnimationFrom =
            currentLean;

        leanAnimationTarget =
            targetLean;

        leanAnimationElapsed =
            0;

    }


    if (settings.reducedMotion) {

        currentLean =
            targetLean;

        leanAnimationFrom =
            targetLean;

        leanAnimationElapsed =
            0;

    } else if (
        leanAnimationFrom !==
        leanAnimationTarget
    ) {

        leanAnimationElapsed +=
            delta;

        const progress =
            getLeanProfileProgress(
                leanAnimationElapsed
            );

        currentLean =
            THREE.MathUtils.lerp(
                leanAnimationFrom,
                leanAnimationTarget,
                progress
            );

        if (
            leanAnimationElapsed >=
                leanPhase1Time +
                leanPhase2Time +
                leanPhase3Time
        ) {

            currentLean =
                leanAnimationTarget;

            leanAnimationFrom =
                leanAnimationTarget;

            leanAnimationElapsed =
                0;

        }

    }


    const leanDistance =
        0.16;

    const leanRoll =
        0.205;


    /*
    Lean path:
    The camera travels on a strictly horizontal, sideways
    path. The roll is derived from that same path position,
    so the camera does not pitch beneath or above the path
    while leaning.
    */
    const pathAmount =
        THREE.MathUtils.clamp(
            currentLean,
            -1,
            1
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const desiredOffset =
        right.multiplyScalar(
            pathAmount *
            leanDistance
        );


    const safeOffset =
        getSafeLeanOffset(
            desiredOffset,
            camera.position.x,
            camera.position.z
        );


    camera.position.add(
        safeOffset
    );

    leanWorldOffset.copy(
        safeOffset
    );


    /*
    Apply roll around the camera's own forward axis instead
    of treating lean like an independent world-axis tilt.
    Yaw/pitch remain the base view; lean only rolls that
    already-oriented camera along its sideways path.
    */
    const baseQuaternion =
        new THREE.Quaternion().setFromEuler(
            new THREE.Euler(
                pitch,
                yaw,
                0,
                "YXZ"
            )
        );

    const rollQuaternion =
        new THREE.Quaternion().setFromAxisAngle(
            new THREE.Vector3(0, 0, 1),
            -pathAmount *
            leanRoll
        );

    camera.quaternion.copy(
        baseQuaternion
    );

    camera.quaternion.multiply(
        rollQuaternion
    );

    camera.rotation.setFromQuaternion(
        camera.quaternion,
        "YXZ"
    );

}


/* =========================================================
PLAYER MOVEMENT
========================================================= */







function movePlayer(delta) {

    clearLeanVisualOffset();

    const input =
        new THREE.Vector3();


    if (keys[keybinds.forward]) {
        input.z -= 1;
    }

    if (keys[keybinds.back]) {
        input.z += 1;
    }

    if (keys[keybinds.left]) {
        input.x -= 1;
    }

    if (keys[keybinds.right]) {
        input.x += 1;
    }


    const hasInput =
        input.lengthSq() > 0;


    if (hasInput) {
        input.normalize();
    }


    const crouchHeld =
        keys[keybinds.crouch];


    const crouchRequested =
        crouchMode === "toggle"
            ? crouchToggleState
            : crouchHeld;


    const sprintHeld =
        keys[keybinds.sprint];


    const sprintRequested =
        sprintMode === "toggle"
            ? sprintToggleState
            : sprintHeld;


    const slowWalkRequested =
        isSlowWalkActive();


    const canSprint =
        sprintRequested &&
        keys[keybinds.forward] &&
        !keys[keybinds.back];


    const isCrouching =
        crouchRequested &&
        !canSprint;


    if (canSprint) {

        leanToggleLeft = false;
        leanToggleRight = false;

        if (currentLean !== 0) {

            clearLeanVisualOffset();

            currentLean = 0;
            leanAnimationFrom = 0;
            leanAnimationTarget = 0;
            leanAnimationElapsed = 0;

        }

    }


    let targetSpeed =
        walkSpeed;


    if (isCrouching) {

        targetSpeed =
            crouchSpeed;

    } else if (canSprint) {

        targetSpeed =
            sprintSpeed;

    } else if (slowWalkRequested) {

        targetSpeed =
            slowWalkSpeed;

    }


    const speedRate =
        hasInput
            ? acceleration
            : deceleration;


    currentSpeed =
        THREE.MathUtils.damp(
            currentSpeed,
            hasInput
                ? targetSpeed
                : 0,
            speedRate,
            delta
        );


    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const movementDirection =
        new THREE.Vector3();


    if (hasInput) {

        movementDirection
            .addScaledVector(
                right,
                input.x
            )
            .addScaledVector(
                forward,
                -input.z
            )
            .normalize();

    }


    const movement =
        movementDirection
            .multiplyScalar(
                currentSpeed *
                delta
            );


    /* ================================================
    COLLISION + LEVEL BOUNDS
    ================================================ */

    const nextX =
        camera.position.x + movement.x;

    if (
        !collidesAt(
            nextX,
            camera.position.z
        )
    ) {

        camera.position.x =
            nextX;

    } else {

        /*
        Block only the X axis. Do not reset currentSpeed here.
        Keeping the movement speed intact lets the player slide
        along a wall naturally when the other movement axis is free.
        */

    }

    const nextZ =
        camera.position.z + movement.z;

    if (
        !collidesAt(
            camera.position.x,
            nextZ
        )
    ) {

        camera.position.z =
            nextZ;

    } else {

        /*
        Block only the Z axis. Do not reset currentSpeed here.
        This preserves full movement speed for wall sliding.
        */

    }

    const boundsPadding =
        0.35;

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            activeLevelBounds.minX + boundsPadding,
            activeLevelBounds.maxX - boundsPadding
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            activeLevelBounds.minZ + boundsPadding,
            activeLevelBounds.maxZ - boundsPadding
        );


    /* ================================================
    HEIGHT
    ================================================ */

    const targetHeight =
        isCrouching
            ? crouchingHeight
            : standingHeight;


    if (settings.reducedMotion) {

        currentHeight =
            targetHeight;

    } else {

        currentHeight =
            THREE.MathUtils.damp(
                currentHeight,
                targetHeight,
                heightSmoothness,
                delta
            );

    }


    camera.position.y =
        currentHeight;

}


/* =========================================================
CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
RENDER LOOP
========================================================= */

let renderLoopId = null;

let lastFrameTime = 0;


let warnedInvalidFrameRate =
    false;


function getFrameInterval() {

    if (
        settings.frameRate ===
        "unlimited"
    ) {

        warnedInvalidFrameRate =
            false;

        return 0;

    }


    const numericRate =
        Number(
            settings.frameRate
        );


    if (
        !Number.isFinite(
            numericRate
        ) ||
        numericRate <= 0
    ) {

        if (!warnedInvalidFrameRate) {

            console.warn(
                "Invalid frame rate setting; falling back to 60 FPS.",
                settings.frameRate
            );

            warnedInvalidFrameRate =
                true;

        }

        return 1000 / 60;

    }


    warnedInvalidFrameRate =
        false;

    return 1000 /
        numericRate;

}


function scheduleNextFrame(
    callback
) {

    renderLoopId =
        requestAnimationFrame(
            callback
        );

}


function gameFrame(
    timestamp
) {

    const frameInterval =
        getFrameInterval();


    if (
        frameInterval > 0 &&
        lastFrameTime !== 0
    ) {

        const elapsed =
            timestamp -
            lastFrameTime;


        if (
            elapsed <
            frameInterval - 1
        ) {

            scheduleNextFrame(
                gameFrame
            );

            return;

        }


        lastFrameTime =
            timestamp -
            (
                elapsed %
                frameInterval
            );

    } else {

        lastFrameTime =
            timestamp;

    }


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    try {

        if (
            !mainMenuOpen &&
            !pauseMenuOpen &&
            !renderContextLost
        ) {

            movePlayer(
                delta
            );

            updateLevel1Doors(
                delta
            );

            updateLean(
                delta
            );

        }


        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;


        if (
            !renderContextLost
        ) {

            renderer.render(
                scene,
                camera
            );

            if (
                debug.lastRenderedTimestamp !== 0
            ) {

                debug.frameTimeMs =
                    timestamp -
                    debug.lastRenderedTimestamp;

            }

            debug.lastRenderedTimestamp =
                timestamp;

            debug.frameCount++;

        }


        updateDebugOverlay();

    } catch (error) {

        console.error(
            "Game frame error:",
            error
        );

        if (!renderContextLost) {

            showTransientMessage(
                "A game update error occurred — continuing the game loop"
            );

        }

    } finally {

        scheduleNextFrame(
            gameFrame
        );

    }

}


/* =========================================================
RESTART LOOP
========================================================= */

function restartRenderLoop() {

    if (
        renderLoopId !== null
    ) {

        cancelAnimationFrame(
            renderLoopId
        );

    }


    renderLoopId =
        null;

    lastFrameTime =
        0;

    debug.frameCount =
        0;

    debug.fps =
        0;

    debug.frameTimeMs =
        0;

    debug.lastRenderedTimestamp =
        0;

    debug.fpsWindowStart =
        performance.now();

    clock.start();

    scheduleNextFrame(
        gameFrame
    );

}


/* =========================================================
FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        settings.fullscreen =
            Boolean(
                document.fullscreenElement
            );

        if (document.fullscreenElement) {
            pendingFullscreenRequest = false;
            disarmFullscreenRetry();
        }

        refreshVisibleSettings();

        updateDebugOverlay(
            true
        );

    }
);


/* =========================================================
RESIZE
========================================================= */

function resizeRenderer() {

    const viewport =
        getViewportSize();

    const width =
        viewport.width;

    const height =
        viewport.height;


    renderer.setSize(
        width,
        height,
        true
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    camera.aspect =
        width /
        height;

    camera.updateProjectionMatrix();

}


window.addEventListener(
    "resize",
    resizeRenderer
);


window.addEventListener(
    "orientationchange",
    resizeRenderer
);


if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizeRenderer
    );

}


/* =========================================================
STARTUP LOADING SCREEN TIMER
========================================================= */

const startupLoadingScreen =
    document.getElementById(
        "startupLoadingScreen"
    );

function finishStartupLoading() {

    if (!startupLoadingScreen) {
        return;
    }

    startupLoadingScreen.classList.add(
        "hidden"
    );

}


window.setTimeout(
    finishStartupLoading,
    1000
);


/* =========================================================
INITIALIZE
========================================================= */

resizeRenderer();

applyBrightness();
updateAllSliderVisuals();

resetGameState();

restartRenderLoop();

loadLevelGeometry(
    currentLevel
);

updateDebugOverlay(
    true
);

</script>

</body>
</html>
