function prepareTexture(
    texture,
    repeatX = 1,
    repeatY = 1
) {

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.anisotropy =
        renderer.capabilities.getMaxAnisotropy();

    return texture;

}


function syncTextureClones(source) {

    const clones =
        source.userData.__levelClones || [];

    clones.forEach(
        clone => {
            clone.image = source.image;
            clone.needsUpdate = true;
        }
    );

    source.userData.__levelClones = [];

}


function cloneTexture(
    source,
    repeatX = 1,
    repeatY = 1
) {

    const clone =
        source.clone();

    clone.image =
        source.image;

    prepareTexture(
        clone,
        repeatX,
        repeatY
    );

    clone.needsUpdate = true;

    if (!source.image) {

        if (!source.userData.__levelClones) {
            source.userData.__levelClones = [];
        }

        source.userData.__levelClones.push(
            clone
        );

    }

    return clone;

}

function collidesAt(x, z) {

    const playerRadius = 0.35;

    for (const wall of collisionWalls) {

        if (
            wall.disabled ||
            x + playerRadius <= wall.minX ||
            x - playerRadius >= wall.maxX ||
            z + playerRadius <= wall.minZ ||
            z - playerRadius >= wall.maxZ
        ) {
            continue;
        }

        return true;

    }

    return false;

}


function addCollisionBox(
    minX,
    maxX,
    minZ,
    maxZ
) {

    const collision = {
        minX,
        maxX,
        minZ,
        maxZ,
        disabled: false
    };

    collisionWalls.push(collision);

    return collision;

}


function applyProportionalWallUVs(
    geometry,
    width,
    height,
    depth
) {

    const uv =
        geometry.attributes.uv;

    /*
    Keep Three.js BoxGeometry's native UV orientation.
    Only scale the existing UVs by the real dimensions
    of each face. This preserves the texture direction
    on every wall face while making the texture density
    consistent across full walls and narrow doorway pieces.

    The previous implementation rebuilt the UV corners
    from scratch, which discarded BoxGeometry's face
    orientation and could make the wallpaper appear
    diagonal or inverted.
    */

    const faceSizes = [
        [depth, height], // +X
        [depth, height], // -X
        [width, depth],  // +Y
        [width, depth],  // -Y
        [width, height], // +Z
        [width, height]  // -Z
    ];

    for (
        let face = 0;
        face < 6;
        face++
    ) {

        const [
            uSize,
            vSize
        ] = faceSizes[face];

        const start =
            face * 4;

        for (
            let vertex = 0;
            vertex < 4;
            vertex++
        ) {

            const index =
                start + vertex;

            uv.setXY(
                index,
                uv.getX(index) * uSize,
                uv.getY(index) * vSize
            );

        }

    }

    uv.needsUpdate = true;

}


function addTexturedWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    textureLength,
    textureSource,
    repeatY = null,
    createCollision = true
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    /*
    Keep the texture at one repeat per world unit.
    The UVs above scale independently for every
    face, so thin wall sections retain the same
    proportions as full-size wall sections.
    */
    applyProportionalWallUVs(
        geometry,
        width,
        height,
        depth
    );

    const wall =
        new THREE.Mesh(
            geometry,
            new THREE.MeshStandardMaterial({
                map: cloneTexture(
                    textureSource,
                    1,
                    1
                )
            })
        );

    wall.position.set(
        x,
        y,
        z
    );

    levelRoot.add(wall);

    if (createCollision) {

        addCollisionBox(
            x - width / 2,
            x + width / 2,
            z - depth / 2,
            z + depth / 2
        );

    }

    return wall;

}


function addVisualWall(
    width,

function addDoorHeader(
    orientation,
    width,
    centerX,
    centerZ,
    wallThickness,
    wallHeight,
    wallTexture
) {

    const openingHeight = 2.2;
    const headerHeight = 0.18;
    const topWallStart = openingHeight + headerHeight;

    if (orientation === "horizontal") {

        // The header sits immediately above the doorway.
        addVisualWall(
            width,
            headerHeight,
            wallThickness,
            centerX,
            openingHeight + headerHeight / 2,
            centerZ,
            Math.max(width, 1),
            wallTexture,
            1
        );

        // Wall continues above the header up to the ceiling.
        const upperHeight = wallHeight - topWallStart;

        if (upperHeight > 0.001) {
            addVisualWall(
                width,
                upperHeight,
                wallThickness,
                centerX,
                topWallStart + upperHeight / 2,
                centerZ,
                Math.max(width, 1),
                wallTexture,
                Math.max(upperHeight, 1)
            );
        }

    } else {

        addVisualWall(
            wallThickness,
            headerHeight,
            width,
            centerX,
            openingHeight + headerHeight / 2,
            centerZ,
            Math.max(width, 1),
            wallTexture,
            1
        );

        const upperHeight = wallHeight - topWallStart;

        if (upperHeight > 0.001) {
            addVisualWall(
                wallThickness,
                upperHeight,
                width,
                centerX,
                topWallStart + upperHeight / 2,
                centerZ,
                Math.max(width, 1),
                wallTexture,
                Math.max(upperHeight, 1)
            );
        }

    }

}


function addHorizontalOpeningWalls(
    wallStartX,
    wallEndX,
    z,
    openingCenterX,
    openingWidth,
    wallThickness,
    wallHeight,
    wallTexture
) {

    const openingLeft =
        openingCenterX - openingWidth / 2;

    const openingRight =
        openingCenterX + openingWidth / 2;

    const leftWidth =
        openingLeft - wallStartX;

    const rightWidth =
        wallEndX - openingRight;

    if (leftWidth > 0.001) {

        addTexturedWall(
            leftWidth,
            wallHeight,
            wallThickness,
            wallStartX + leftWidth / 2,
            wallHeight / 2,
            z,
            leftWidth,
            wallTexture
        );

    }

    if (rightWidth > 0.001) {

        addTexturedWall(
            rightWidth,
            wallHeight,
            wallThickness,
            openingRight + rightWidth / 2,
            wallHeight / 2,
            z,
            rightWidth,
            wallTexture
        );

    }

    // No footer: the doorway remains open all the way to the floor.
    addDoorHeader(
        "horizontal",
        openingWidth,
        openingCenterX,
        z,
        wallThickness,
        wallHeight,
        wallTexture
    );

}


function addVerticalOpeningWalls(
    x,
    wallStartZ,
    wallEndZ,
    openingCenterZ,
    openingLength,
    wallThickness,
    wallHeight,
    wallTexture
) {

    const openingStart =
        openingCenterZ - openingLength / 2;

    const openingEnd =
        openingCenterZ + openingLength / 2;

    const beforeLength =
        openingStart - wallStartZ;

    const afterLength =
        wallEndZ - openingEnd;

    if (beforeLength > 0.001) {

        addTexturedWall(
            wallThickness,
            wallHeight,
            beforeLength,
            x,
            wallHeight / 2,
            wallStartZ + beforeLength / 2,
            beforeLength,
            wallTexture
        );

    }

    if (afterLength > 0.001) {

        addTexturedWall(
            wallThickness,
            wallHeight,
            afterLength,
            x,
            wallHeight / 2,
            openingEnd + afterLength / 2,
            afterLength,
            wallTexture
        );

    }

    // No footer here either. The floor remains completely clear.
    addDoorHeader(
        "vertical",
        openingLength,
        x,
        openingCenterZ,
        wallThickness,
        wallHeight,
        wallTexture
    );

}


function addWindowFrame(
    orientation,
    length,
    height,
    centerX,
    centerZ
) {

    const frameThickness = 0.08;
    const frameDepth = 0.10;
    const frameMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x777777
        });

    const frame =
        new THREE.Group();

    frame.position.set(
        centerX,
        2,
        centerZ
    );

    if (orientation === "vertical") {

        const top = new THREE.Mesh(
            new THREE.BoxGeometry(
                frameDepth,
                frameThickness,
                length + frameThickness * 2
            ),
            frameMaterial
        );
        top.position.y = height / 2;
        frame.add(top);

        const bottom = top.clone();
        bottom.position.y = -height / 2;
        frame.add(bottom);

        const left = new THREE.Mesh(
            new THREE.BoxGeometry(
                frameDepth,
                height,
                frameThickness
            ),
            frameMaterial
        );
        left.position.z = -length / 2;
        frame.add(left);

        const right = left.clone();
        right.position.z = length / 2;
        frame.add(right);

    } else {

        const top = new THREE.Mesh(
            new THREE.BoxGeometry(
                length + frameThickness * 2,
                frameThickness,
                frameDepth
            ),
            frameMaterial
        );
        top.position.y = height / 2;
        frame.add(top);

        const bottom = top.clone();
        bottom.position.y = -height / 2;
        frame.add(bottom);

        const left = new THREE.Mesh(
            new THREE.BoxGeometry(
                frameThickness,
                height,
                frameDepth
            ),
            frameMaterial
        );
        left.position.x = -length / 2;
        frame.add(left);

        const right = left.clone();
        right.position.x = length / 2;
        frame.add(right);

    }

    levelRoot.add(frame);

    return frame;

}

function addDoor(
    orientation,
    width,
    centerX,
    centerZ,
    wallThickness,
    wallHeight,
    wallTexture,
    doorTexture,
    working = false
) {

    const doorHeight = 2.2;

    const pivot =
        new THREE.Group();

    const hingeX =
        orientation === "horizontal"
            ? centerX - width / 2
            : centerX;

    const hingeZ =
        orientation === "horizontal"
            ? centerZ
            : centerZ - width / 2;

    pivot.position.set(
        hingeX,
        0,
        hingeZ
    );

    const door =
        new THREE.Mesh(
            orientation === "horizontal"
                ? new THREE.BoxGeometry(width, doorHeight, 0.08)
                : new THREE.BoxGeometry(0.08, doorHeight, width),
            new THREE.MeshStandardMaterial({
                map: cloneTexture(
                    doorTexture,
                    1,
                    1
                )
            })
        );

    if (orientation === "horizontal") {

        door.position.set(
            width / 2,
            doorHeight / 2,
            0
        );

    } else {

        door.position.set(
            0,
            doorHeight / 2,
            width / 2
        );

    }

    pivot.add(door);
    levelRoot.add(pivot);

    const collision = addCollisionBox(
        orientation === "horizontal"
            ? centerX - width / 2
            : centerX - 0.04,
        orientation === "horizontal"
            ? centerX + width / 2
            : centerX + 0.04,
        orientation === "horizontal"
            ? centerZ - 0.04
            : centerZ - width / 2,
        orientation === "horizontal"
            ? centerZ + 0.04
            : centerZ + width / 2
    );

    const startsOpen = working;

    const data = {
        pivot,
        door,
        collision,
        centerX,
        centerZ,
        open: startsOpen,
        angle: startsOpen ? -Math.PI / 2 : 0,
        targetAngle: startsOpen ? -Math.PI / 2 : 0,
        working
    };

    // The working Hallway door is shown open in the Level 1 map.
    // Keep its doorway passable on spawn; pressing E can close it.
    if (startsOpen) {
        collision.disabled = true;
        pivot.rotation.y = -Math.PI / 2;
    }

    level1Doors.push(data);

    return data;

}


function toggleNearestWorkingDoor() {

    if (
        mainMenuOpen ||
        pauseMenuOpen ||
        currentLevel !== 1
    ) {
        return;
    }

    let nearest = null;
    let nearestDistance = 1.75;

    for (const doorData of level1Doors) {

        if (!doorData.working) {
            continue;
        }

        const distance =
            Math.hypot(
                camera.position.x - doorData.centerX,
                camera.position.z - doorData.centerZ
            );

        if (distance < nearestDistance) {
            nearest = doorData;
            nearestDistance = distance;
        }

    }

    if (!nearest) {
        return;
    }

    nearest.open = !nearest.open;

    nearest.targetAngle =
        nearest.open
            ? -Math.PI / 2
            : 0;

    nearest.collision.disabled =
        nearest.open;

    showTransientMessage(
        nearest.open
            ? "Door opened"
            : "Door closed"
    );

}


function updateLevel1Doors(delta) {

    for (const doorData of level1Doors) {

        const smoothing =
            Math.min(
                1,
                delta * 10
            );

        doorData.angle +=
            (
                doorData.targetAngle -
                doorData.angle
            ) * smoothing;

        doorData.pivot.rotation.y =
            doorData.angle;

    }

}


/* =========================================================
LEVEL 1 BUILD

6 columns × 26 rows, 1 world unit per grid tile.
Grid origin is the top-left of the building.
World X: grid 0..6 -> -3..3.
World Z: grid 0..26 -> -13..13.

A  = rows 0..8, carpet.

function clearLevelGeometry() {

    while (levelRoot.children.length) {

        const child =
            levelRoot.children.pop();

        child.traverse(
            object => {

                if (object.geometry) {
                    object.geometry.dispose();
                }

                if (object.material) {

                    const materials =
                        Array.isArray(object.material)
                            ? object.material
                            : [object.material];

                    materials.forEach(
                        material => {

                            if (material.map) {
                                material.map.dispose();
                            }

                            material.dispose();

                        }
                    );

                }

            }
        );

    }

    collisionWalls.length = 0;
    level1Doors.length = 0;

}

    activeLevelBounds = {
        minX: -baseplateWidth / 2,
        maxX: baseplateWidth / 2,
        minZ: -baseplateLength / 2,
        maxZ: baseplateLength / 2
    };

}

function registerSaveSystem(
    name,
    saveCallback,
    loadCallback
) {

    if (
        typeof name !== "string" ||
        !name
    ) {
        return;
    }

    if (
        typeof saveCallback === "function"
    ) {
        saveStateProviders.set(
            name,

        );

    if (
        typeof loadCallback === "function"
    ) {
        loadStateProviders.set(
            name,
            loadCallback
        );

}


/* =========================================================
SAFE STORAGE
========================================================= */

function safeStorageGet(key) {

    try {

        return {
            ok: true,
            value:
                localStorage.getItem(key)
        };

    } catch (error) {

        console.warn(
            "Storage read failed:",
            error
        );

        return {
            ok: false,
            value: null,
            error
        };

    }

}


function safeStorageSet(
    key,
    value
) {

    try {

        localStorage.setItem(
            key,
            value
        );

        return true;

    } catch (error) {

        console.warn(
            "Storage write failed:",
            error
        );

        return false;

    }

}


function safeStorageRemove(key) {

    try {

        localStorage.removeItem(
            key
        );

        return true;

    } catch (error) {

        console.warn(
            "Storage remove failed:",
            error
        );

        return false;

    }

}


function getStorageByteSize(value) {

    try {

        return new Blob([
            String(value)
        ]).size;

    } catch (error) {

        return String(value).length;

    }

}

function normalizeLevelNumber(
    value
) {

    const numeric =
        Number(value);

    return (
        Number.isInteger(numeric) &&
        levels[numeric]
    )
        ? numeric
        : null;

}


function isPlainObject(value) {

    return (
        value !== null &&
        typeof value === "object" &&
        !Array.isArray(value)
    );

}


function addRepair(
    repairs,
    path
) {

    if (
        !repairs.includes(path)
    ) {

        repairs.push(path);

    }

}


function cleanFinite(
    value,
    fallback,
    minimum,
    maximum,
    repairs,
    path
) {

    const numeric =
        Number(value);

    if (
        !Number.isFinite(numeric)
    ) {

        addRepair(
            repairs,
            path
        );

        return fallback;

    }

    const clamped =
        THREE.MathUtils.clamp(
            numeric,
            minimum,
            maximum
        );

    if (
        clamped !== numeric
    ) {

        addRepair(
            repairs,
            path
        );

    }

    return clamped;

}


function validateSettings(
    raw,
    repairs
) {

    const source =
        isPlainObject(raw)
            ? raw
            : {};


    let sensitivity =
        Number(
            source.sensitivity
        );

    if (
        !Number.isInteger(sensitivity) ||
        sensitivity < 1 ||
        sensitivity > 200
    ) {

        sensitivity =
            DEFAULT_SETTINGS.sensitivity;

        addRepair(
            repairs,
            "settings.sensitivity"
        );

    }


    let brightness =
        Number(
            source.brightness
        );

    if (
        !Number.isInteger(brightness) ||
        brightness < 50 ||
        brightness > 150
    ) {

        brightness =
            DEFAULT_SETTINGS.brightness;

        addRepair(
            repairs,
            "settings.brightness"
        );

    }


    let frameRate;

    const frameRateMatch =
        frameRateOptions.find(
            option =>
                String(option) ===
                String(source.frameRate)
        );

    if (
        frameRateMatch === undefined
    ) {

        frameRate =
            DEFAULT_SETTINGS.frameRate;

        addRepair(
            repairs,
            "settings.frameRate"
        );

    } else {

        frameRate =
            frameRateMatch === "unlimited"
                ? "unlimited"
                : Number(
                    frameRateMatch
                );

    }


    let fullscreen =
        source.fullscreen;

    if (
        typeof fullscreen !==
        "boolean"
    ) {

        fullscreen =
            DEFAULT_SETTINGS.fullscreen;

        addRepair(
            repairs,
            "settings.fullscreen"
        );

    }


    let reducedMotion =
        source.reducedMotion;

    if (
        typeof reducedMotion !==
        "boolean"
    ) {

        reducedMotion =
            DEFAULT_SETTINGS.reducedMotion;

        addRepair(
            repairs,
            "settings.reducedMotion"
        );

    }


    return {
        sensitivity,
        fullscreen,
        frameRate,
        brightness,
        reducedMotion
    };

}


function validateKeybinds(
    raw,
    repairs
) {

    const source =
        isPlainObject(raw)
            ? raw
            : {};

    const result = {};

    const used =
        new Set();


    for (
        const action of
        Object.keys(
            DEFAULT_KEYBINDS
        )
    ) {

        const sourceCode =
            source[action];

        const isUnbound =
            sourceCode === "Unbound";

        const validString =
            typeof sourceCode === "string" &&
            sourceCode.length > 0;

        const reservedEscape =
            action !== "menu" &&
            sourceCode === "Escape";

        const duplicate =
            validString &&
            !isUnbound &&
            used.has(sourceCode);

        let code = sourceCode;

        if (
            !validString ||
            reservedEscape ||
            duplicate
        ) {

            addRepair(
                repairs,
                `keybinds.${action}`
            );

            const fallback =
                DEFAULT_KEYBINDS[action];

            if (
                fallback === "Unbound" ||
                !used.has(fallback)
            ) {

                code = fallback;

            } else {

                /*
                Never steal another action's default when repairing.
                Use an explicit unbound sentinel instead.
                */
                code = "Unbound";

            }

        }


        result[action] =
            code;


        if (
            code !== "Unbound"
        ) {

            used.add(code);

        }

    }


    return result;

}


function validateControls(

function normalizeSaveData(
    raw,
    expectedSlot = null
) {

    const repairs = [];


    if (
        !isPlainObject(raw)
    ) {

        return {
            data: null,
            repaired: true,
            repairCount: 1,
            repairs: ["root"]
        };

    const player =

            ? raw.player

        )
            ? player.position
            : player;

    const playerCamera =
        isPlainObject(
            player.camera
        )
            ? player.camera
            : {};

    const savedCamera =
        isPlainObject(raw.camera)
            ? raw.camera
            : {};


    const savedCameraPosition =
        isPlainObject(
            savedCamera.position
        )
            ? savedCamera.position
            : null;

    const savedCameraRotation =
        isPlainObject(
            savedCamera.rotation
        )
            ? savedCamera.rotation
            : {};


    const position = {

        x: cleanFinite(
            savedCameraPosition?.x ??
                playerPosition.x,
            0,
            -10000,
            10000,
            repairs,
            "camera.position.x"
        ),

        y: cleanFinite(
            savedCameraPosition?.y ??
                playerPosition.y,
            standingHeight,
            0.1,
            1000,
            repairs,
            "camera.position.y"
        ),

        z: cleanFinite(
            savedCameraPosition?.z ??
                playerPosition.z,
            0,
            -10000,
            10000,
            repairs,
            "camera.position.z"
        )

    };


    const yaw =
        cleanFinite(
            savedCameraRotation.y ??
                playerCamera.yaw ??
                player.yaw,
            0,
            -Math.PI * 100,
            Math.PI * 100,
            repairs,
            "camera.rotation.yaw"
        );


    const pitch =
        cleanFinite(
            savedCameraRotation.x ??
                playerCamera.pitch ??
                player.pitch,
            0,
            -Math.PI / 2 + 0.01,
            Math.PI / 2 - 0.01,
            repairs,
            "camera.rotation.pitch"
        );


    const fov =
        cleanFinite(
            savedCamera.fov,
            75,
            30,
            120,
            repairs,
            "camera.fov"
        );


    const speed =
        cleanFinite(
            player.currentSpeed,
            0,
            0,
            Math.max(
                walkSpeed,
                sprintSpeed
            ),
            repairs,
            "player.currentSpeed"
        );


    const height =
        cleanFinite(
            player.currentHeight,
            standingHeight,
            crouchingHeight,
            standingHeight,
            repairs,
            "player.currentHeight"
        );


    const sprintToggleStateRaw =
        typeof player.sprintToggleState ===
            "boolean"
            ? player.sprintToggleState
            : (
                addRepair(
                    repairs,
                    "player.sprintToggleState"
                ),
                false
            );


    const crouchToggleStateRaw =
        typeof player.crouchToggleState ===
            "boolean"
            ? player.crouchToggleState
            : (
                addRepair(
                    repairs,
                    "player.crouchToggleState"
                ),
                false
            );


    const slowWalkToggleStateRaw =
        typeof player.slowWalkToggleState ===
            "boolean"
            ? player.slowWalkToggleState
            : (
                addRepair(
                    repairs,
                    "player.slowWalkToggleState"
                ),
                false
            );


    const leanToggleLeftRaw =
        typeof player.leanToggleLeft ===
            "boolean"
            ? player.leanToggleLeft
            : (
                addRepair(
                    repairs,
                    "player.leanToggleLeft"
                ),
                false
            );


    const leanToggleRightRaw =
        typeof player.leanToggleRight ===
            "boolean"
            ? player.leanToggleRight
            : (
                addRepair(
                    repairs,
                    "player.leanToggleRight"
                ),
                false
            );


    const settingsClean =
        validateSettings(
            raw.settings,
            repairs
        );


    const keybindsClean =
        validateKeybinds(
            raw.keybinds,
            repairs
        );


    const controlsClean =
        validateControls(
            raw.controls ||
                {
                    sprintMode:
                        raw.sprintMode,
                    crouchMode:
                        raw.crouchMode,
                    leanMode:
                        raw.leanMode,
                    slowWalkMode:
                        raw.slowWalkMode
                },
            repairs
        );


    const sprintToggleState =
        controlsClean.sprintMode === "toggle"
            ? sprintToggleStateRaw
            : false;

    const crouchToggleState =
        controlsClean.crouchMode === "toggle"
            ? crouchToggleStateRaw
            : false;

    const slowWalkToggleState =
        controlsClean.slowWalkMode === "toggle"
            ? slowWalkToggleStateRaw
            : false;

    const leanToggleLeft =
        controlsClean.leanMode === "toggle"
            ? leanToggleLeftRaw
            : false;

    const leanToggleRight =
        controlsClean.leanMode === "toggle"
            ? leanToggleRightRaw
            : false;

    if (
        controlsClean.sprintMode === "hold" &&
        sprintToggleStateRaw
    ) {
        addRepair(repairs, "player.sprintToggleState");
    }

    if (
        controlsClean.crouchMode === "hold" &&
        crouchToggleStateRaw
    ) {
        addRepair(repairs, "player.crouchToggleState");
    }

    if (
        controlsClean.slowWalkMode === "hold" &&
        slowWalkToggleStateRaw
    ) {
        addRepair(repairs, "player.slowWalkToggleState");
    }

    if (
        controlsClean.leanMode === "hold" &&
        (leanToggleLeftRaw || leanToggleRightRaw)
    ) {
        addRepair(repairs, "player.leanToggleState");
    }


    let level =
        normalizeLevelNumber(
            raw.level
        );


    if (
        level === null
    ) {

        level =
            expectedSlot &&
            levels[expectedSlot]
                ? expectedSlot
                : 1;

        addRepair(
            repairs,
            "level"
        );

    }


    let slot =
        Number(raw.slot);


    if (
        !Number.isInteger(slot) ||
        slot < 1 ||
        slot > SAVE_SLOT_COUNT
    ) {

        slot =
            expectedSlot ||
            level;

        addRepair(
            repairs,
            "slot"
        );

    }


    if (
        expectedSlot &&
        slot !== expectedSlot
    ) {

        slot =
            expectedSlot;

        addRepair(
            repairs,
            "slot"
        );

    }


    const savedAtNumber =
        Number(raw.savedAt);


    const savedAt =
        Number.isFinite(
            savedAtNumber
        ) &&
        savedAtNumber > 0
            ? savedAtNumber
            : (
                addRepair(
                    repairs,
                    "savedAt"
                ),
                Date.now()
            );


    const world =
        isPlainObject(raw.world)
            ? raw.world
            : {};

    if (
        !isPlainObject(raw.world)
    ) {

        addRepair(
            repairs,
            "world"
        );

    }


    const future =
        isPlainObject(raw.future)
            ? raw.future
            : {};

    if (
        !isPlainObject(raw.future)
    ) {

        addRepair(
            repairs,
            "future"
        );

    }


    return {

        data: {

            version:
                SAVE_VERSION,

            build:
                typeof raw.build ===
                    "string"
                    ? raw.build
                    : GAME_BUILD,

            slot,

            savedAt,

            level,


            player: {

                currentSpeed:
                    speed,

                currentHeight:
                    height,

                sprintToggleState,

                crouchToggleState,

                slowWalkToggleState,

                leanToggleLeft,

                leanToggleRight

            },


            camera: {

                position: {
                    ...position
                },

                rotation: {
                    x: pitch,
                    y: yaw
                },

                fov

            },


            settings:
                settingsClean,

            keybinds:
                keybindsClean,

            controls:
                controlsClean,

            world,

            future

        },

        repaired:
            repairs.length > 0,

        repairCount:
            repairs.length,

        repairs

    };

}


/* =========================================================
READ SAVE SLOT
========================================================= */

function readSaveSlotRecord(
    slotNumber
) {

    if (
        !Number.isInteger(slotNumber) ||
        slotNumber < 1 ||
        slotNumber > SAVE_SLOT_COUNT
    ) {

        return {
            status: "invalid",
            data: null
        };

    }


    const result =
        safeStorageGet(
            getSaveSlotKey(
                slotNumber
            )
        );


    if (
        !result.ok
    ) {

        return {
            status: "unavailable",
            data: null
        };

    }


    if (
        !result.value
    ) {

        return {
            status: "empty",
            data: null
        };

    }


    try {

        const data =
            JSON.parse(
                result.value
            );


        if (
            !isPlainObject(data)
        ) {

            return {
                status: "corrupted",
                data: null
            };

        }


        return {
            status: "ok",
            data,
            bytes: getStorageByteSize(result.value)
        };

    } catch (error) {

        console.error(
            `Save slot ${slotNumber} could not be parsed:`,
            error
        );

        return {
            status: "corrupted",
            data: null,
            error
        };

    }

}


function readSaveSlot(
    slotNumber
) {

    const record =
        readSaveSlotRecord(
            slotNumber
        );

    return (
        record.status === "ok"
            ? record.data
            : null
    );

}


/* =========================================================
BUILD SAVE DATA
========================================================= */

function buildSaveData(
    slotNumber = currentLevel
) {

    const futureData = {};


    for (
        const [
            name,
            callback
        ] of saveStateProviders
    ) {

        try {

            futureData[name] =
                callback();

        } catch (error) {

            console.error(
                `Save system "${name}" failed:`,
                error
            );

        }

    }


    return {

        version:
            SAVE_VERSION,

        build:
            GAME_BUILD,

        slot:
            slotNumber,

        savedAt:
            Date.now(),

        level:
            currentLevel,


        player: {

            currentSpeed,

            currentHeight,

            sprintToggleState:
                sprintMode === "toggle"
                    ? sprintToggleState
                    : false,

            crouchToggleState:
                crouchMode === "toggle"
                    ? crouchToggleState
                    : false,

            slowWalkToggleState:
                slowWalkMode === "toggle"
                    ? slowWalkToggleState
                    : false,

            leanToggleLeft:
                leanMode === "toggle"
                    ? leanToggleLeft
                    : false,

            leanToggleRight:
                leanMode === "toggle"
                    ? leanToggleRight
                    : false

        },


        camera: {

            position: {

                x:
                    camera.position.x -
                    leanWorldOffset.x,

                y:
                    camera.position.y,

                z:
                    camera.position.z -
                    leanWorldOffset.z

            },

            rotation: {

                x:
                    pitch,

                y:
                    yaw

            },

            fov:
                camera.fov

        },


        settings: {
            ...settings
        },

        keybinds: {
            ...keybinds
        },

        controls: {
            sprintMode,
            crouchMode,
            leanMode,
            slowWalkMode
        },


        /*
        Reserved for future level/world systems.
        Add new persistent systems through
        registerSaveSystem(...) instead of
        rewriting the save layer.
        */
        world: {},

        future:
            futureData

    };

}


/* =========================================================
SAVE GAME

The destination slot is chosen explicitly.
A slot may contain a save from any level.
========================================================= */

function saveGame(
    targetSlot = currentLevel
) {

    const slotNumber =
        Number(targetSlot);


    if (
        !Number.isInteger(slotNumber) ||
        slotNumber < 1 ||
        slotNumber > SAVE_SLOT_COUNT
    ) {

        return false;

    }


    let serialized;


    try {

        serialized =
            JSON.stringify(
                buildSaveData(
                    slotNumber
                )
            );

    } catch (error) {

        console.error(
            "Game could not be serialized:",
            error
        );

        showTransientMessage(
            "Save Failed — game state could not be serialized"
        );

        return false;

    }


    if (
        !safeStorageSet(
            getSaveSlotKey(
                slotNumber
            ),
            serialized
        )
    ) {

        showTransientMessage(
            "Save Failed — storage full or unavailable"
        );

        return false;

    }


    console.info(
        `Save slot ${slotNumber} written: ${
            getStorageByteSize(
                serialized
            )
        } bytes`
    );

    invalidateSavedSlotCountCache();

    return true;

}


/* =========================================================
APPLY SAVE DATA
========================================================= */

function applySaveData(
    rawSaveData,
    expectedSlot = null
) {

    const normalized =
        normalizeSaveData(
            rawSaveData,
            expectedSlot
        );


    if (
        !normalized.data
    ) {

        return normalized;

    }


    const saveData =
        normalized.data;


    currentLevel =
        saveData.level;


    camera.position.set(
        saveData.camera.position.x,
        saveData.camera.position.y,
        saveData.camera.position.z
    );


    yaw =
        saveData.camera.rotation.y;

    pitch =
        saveData.camera.rotation.x;


    currentSpeed =
        saveData.player.currentSpeed;

    currentHeight =
        saveData.player.currentHeight;

    sprintToggleState =
        saveData.controls.sprintMode === "toggle"
            ? saveData.player.sprintToggleState
            : false;

    crouchToggleState =
        saveData.controls.crouchMode === "toggle"
            ? saveData.player.crouchToggleState
            : false;

    slowWalkToggleState =
        saveData.controls.slowWalkMode === "toggle"
            ? saveData.player.slowWalkToggleState
            : false;

    leanToggleLeft =
        saveData.controls.leanMode === "toggle"
            ? saveData.player.leanToggleLeft
            : false;

    leanToggleRight =
        saveData.controls.leanMode === "toggle"
            ? saveData.player.leanToggleRight
            : false;

    currentLean = 0;
leanWorldOffset.set(0, 0, 0);


    Object.assign(
        settings,
        saveData.settings
    );


    Object.assign(
        keybinds,
        saveData.keybinds
    );


    sprintMode =
        saveData.controls.sprintMode;

    crouchMode =
        saveData.controls.crouchMode;

    leanMode =
        saveData.controls.leanMode;

    slowWalkMode =
        saveData.controls.slowWalkMode;


    camera.fov =
        saveData.camera.fov;

    camera.updateProjectionMatrix();


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    camera.rotation.z =
        0;

    currentLean = 0;
leanWorldOffset.set(0, 0, 0);


    applyBrightness();


    pendingFullscreenRequest =
        Boolean(
            settings.fullscreen &&
            !document.fullscreenElement
        );

    if (
        pendingFullscreenRequest
    ) {
        armFullscreenRetry();
    } else {
        disarmFullscreenRetry();
    }


    clearHeldKeys();


    for (
        const [
            name,
            callback
        ] of loadStateProviders
    ) {

        try {

            callback(
                saveData.future?.[name],
                saveData
            );

        } catch (error) {

            console.error(
                `Load system "${name}" failed:`,
                error
            );

        }

    }


    return normalized;

}


/* =========================================================
LOAD GAME SLOT
========================================================= */

function loadGame(
    slotNumber
) {

    const normalizedSlot =
        Number(
            slotNumber
        );


    if (
        !Number.isInteger(
            normalizedSlot
        ) ||
        normalizedSlot < 1 ||
        normalizedSlot > SAVE_SLOT_COUNT
    ) {

        return false;

    }


    const record =
        readSaveSlotRecord(
            normalizedSlot
        );


    if (
        record.status ===
        "unavailable"
    ) {

        showTransientMessage(
            "Save storage is unavailable"
        );

        return false;

    }


    if (
        record.status !==
        "ok"
    ) {

        showLoadGamePage();

        return false;

    }


    const normalized =
        applySaveData(
            record.data,
            normalizedSlot
        );


    if (
        !normalized.data
    ) {

        showLoadGamePage();

        return false;

    }


    enterGame();


    if (
        normalized.repaired
    ) {

        showTransientMessage(
            `Save was repaired (${
                normalized.repairCount
            } field${
                normalized.repairCount === 1
                    ? ""
                    : "s"
            } reset).`
        );

    }


    return true;

}


/* =========================================================
CLEAR SAVE SLOT
========================================================= */

function clearSaveSlot(
    slotNumber
) {

    const normalizedSlot =
        Number(
            slotNumber
        );


    if (
        !Number.isInteger(
            normalizedSlot
        ) ||
        normalizedSlot < 1 ||
        normalizedSlot > SAVE_SLOT_COUNT
    ) {

        return false;

    }


    if (
        !safeStorageRemove(
            getSaveSlotKey(
                normalizedSlot
            )
        )
    ) {

        showTransientMessage(
            "Save slot could not be cleared — storage unavailable"
        );

        return false;

    }


    invalidateSavedSlotCountCache();

    showTransientMessage(
        `Slot ${normalizedSlot} cleared`
    );

    return true;

}


/* =========================================================
DUPLICATE SAVE STATE
========================================================= */

let duplicateSourceSlot = null;


function cloneSaveData(value) {

    try {

        return JSON.parse(
            JSON.stringify(value)
        );

    } catch (error) {

        console.error(
            "Save could not be duplicated:",
            error
        );

        return null;

    }

}


function duplicateSaveSlot(
    sourceSlot,
    destinationSlot
) {

    const source =
        Number(sourceSlot);

    const destination =
        Number(destinationSlot);


    if (
        !Number.isInteger(source) ||
        source < 1 ||
        source > SAVE_SLOT_COUNT ||
        !Number.isInteger(destination) ||
        destination < 1 ||
        destination > SAVE_SLOT_COUNT ||
        source === destination
    ) {

        return false;

    }


    const sourceRecord =
        readSaveSlotRecord(source);


    if (
        sourceRecord.status !== "ok"
    ) {

        showTransientMessage(
            "The source save is unavailable."
        );

        return false;

    }


    const copy =
        cloneSaveData(
            sourceRecord.data
        );


    if (!copy) {

        showTransientMessage(
            "Duplicate Failed — save could not be copied"
        );

        return false;

    }


    /* The destination slot becomes the save's canonical slot. */
    copy.slot = destination;


    const serialized =
        JSON.stringify(copy);


    if (
        !safeStorageSet(
            getSaveSlotKey(destination),
            serialized
        )
    ) {

        showTransientMessage(
            "Duplicate Failed — storage full or unavailable"
        );

        return false;

    }


    invalidateSavedSlotCountCache();

    console.info(
        `Save slot ${source} duplicated to slot ${destination}: ${
            getStorageByteSize(serialized)
        } bytes`
    );

    showTransientMessage(
        `Save duplicated to Slot ${destination}`
    );

    return true;

}

                    }


                    if (

                                </span>

                                </span>

                    }


                    if (

                                    Slot ${slotNumber} — Empty

/* =========================================================
LEGACY SAVE MIGRATION
========================================================= */

function migrateLegacySave() {

    const marker =
        safeStorageGet(
            LEGACY_MIGRATION_KEY
        );


    if (
        marker.ok &&
        marker.value === "1"
    ) {

        return;

    }


    const legacyResult =
        safeStorageGet(
            SAVE_KEY
        );


    if (
        !legacyResult.ok
    ) {

        return;

    }


    if (
        !legacyResult.value
    ) {

        safeStorageSet(
            LEGACY_MIGRATION_KEY,
            "1"
        );

        return;

    }


    try {

        const legacy =
            JSON.parse(
                legacyResult.value
            );

        const level =
            normalizeLevelNumber(
                legacy?.level
            );


        if (
            level !== null
        ) {

            const existing =
                safeStorageGet(
                    getSaveSlotKey(level)
                );


            if (
                existing.ok &&
                !existing.value
            ) {

                const normalized =
                    normalizeSaveData(
                        legacy,
                        level
                    );


                if (
                    normalized.data
                ) {

                    const migrated =
                        JSON.stringify(
                            normalized.data
                        );

                    if (
                        safeStorageSet(
                            getSaveSlotKey(level),
                            migrated
                        )
                    ) {
                        invalidateSavedSlotCountCache();
                    }

                }

            }

        }


        safeStorageSet(
            LEGACY_MIGRATION_KEY,
            "1"
        );

    } catch (error) {

        console.error(
            "Legacy save migration failed:",
            error
        );

    }

}


requestAnimationFrame(() => {
    requestAnimationFrame(
        migrateLegacySave
    );
});

leanWorldOffset.set(0, 0, 0);

/* =========================================================
START SELECTED LEVEL
========================================================= */

function startLevel(levelNumber) {

    const normalizedLevel =
        normalizeLevelNumber(
            levelNumber
        );


    if (
        normalizedLevel === null
    ) {

        return false;

    }


    currentLevel =
        normalizedLevel;

    resetGameState();

}


/* =========================================================
KEY DISPLAY
========================================================= */

function keyCodeToDisplay(code) {

    const displayNames = {

        KeyW: "W",
        KeyA: "A",
        KeyS: "S",
        KeyD: "D",

        ShiftLeft: "SHIFT",
        ShiftRight: "SHIFT",

        AltLeft: "ALT",
        AltRight: "ALT",

        KeyC: "C",

        ControlLeft: "CTRL",
        ControlRight: "CTRL",

        Space: "SPACE",

        Tab: "TAB",
        Enter: "ENTER",
        Escape: "ESC",

        Backspace: "BACKSPACE",

        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT",

        Delete: "DELETE",
        Insert: "INSERT",

        Home: "HOME",
        End: "END",

        PageUp: "PAGE UP",
        PageDown: "PAGE DOWN"

    };


    if (displayNames[code]) {
        return displayNames[code];
    }


    if (code.startsWith("Key")) {

        return code
            .substring(3)
            .toUpperCase();

    }


    if (code.startsWith("Digit")) {

        return code
            .substring(5);

    }


    if (code.startsWith("Numpad")) {

        return code
            .substring(6)
            .toUpperCase();

    }


    return code
        .replace(/([A-Z])/g, " $1")
        .trim()
        .toUpperCase();

}


/* =========================================================
CLEAR HELD KEYS
========================================================= */

function clearHeldKeys() {

    for (const key in keys) {
        keys[key] = false;
    }

}


/* =========================================================
BRIGHTNESS
========================================================= */

function applyBrightness() {

    renderer.domElement.style.filter =
        `brightness(${settings.brightness / 100})`;

}


/* =========================================================
FULLSCREEN
========================================================= */

let pendingFullscreenRequest =
    false;

let fullscreenRetryListenerAttached =
    false;


function disarmFullscreenRetry() {

    if (
        fullscreenRetryListenerAttached
    ) {

        document.removeEventListener(
            "click",
            retryPendingFullscreen
        );

        fullscreenRetryListenerAttached =
            false;

    }

}


function armFullscreenRetry() {

    if (
        fullscreenRetryListenerAttached
    ) {

        return;

    }

    document.addEventListener(
        "click",
        retryPendingFullscreen
    );

    fullscreenRetryListenerAttached =
        true;

}


function retryPendingFullscreen() {

    if (
        !pendingFullscreenRequest ||
        !settings.fullscreen ||
        document.fullscreenElement
    ) {

        disarmFullscreenRetry();
        return;

    }

    applyFullscreen(true);

}


async function applyFullscreen(
    fromUserGesture = false
) {

    if (
        settings.fullscreen &&
        !document.fullscreenElement
    ) {

        if (
            !fromUserGesture
        ) {

            pendingFullscreenRequest =
                true;

            armFullscreenRetry();

            return false;

        }


        try {

            await document
                .documentElement
                .requestFullscreen();

            pendingFullscreenRequest =
                false;

            disarmFullscreenRetry();

            return true;

        } catch (error) {

            console.warn(
                "Fullscreen unavailable:",
                error
            );

            settings.fullscreen =
                false;

            pendingFullscreenRequest =
                false;

            disarmFullscreenRetry();

            refreshVisibleSettings();

            showTransientMessage(
                "Fullscreen unavailable"
            );

            return false;

        }

    }


    if (
        !settings.fullscreen &&
        document.fullscreenElement
    ) {

        try {

            await document.exitFullscreen();

            pendingFullscreenRequest =
                false;

            disarmFullscreenRetry();

            return true;

        } catch (error) {

            console.warn(
                "Could not exit fullscreen:",
                error
            );

            return false;

        }

    }


    pendingFullscreenRequest =
        false;

    disarmFullscreenRetry();

    return true;

}

function refreshVisibleSettings() {

    if (
        mainMenuOpen &&
        activePage
    ) {

        if (activePage === "controls") {
            showControlsPage("main");
        }

        if (activePage === "display") {
            showDisplayPage("main");
        }

        if (activePage === "accessibility") {
            showAccessibilityPage("main");
        }

    }


    if (
        pauseMenuOpen &&
        !waitingForBindAction
    ) {

        if (
            pauseContent.dataset.page ===
            "controls"
        ) {
            showControlsPage("pause");
        }

        if (

            "display"
        ) {
            showDisplayPage("pause");
        }

        if (
            pauseContent.dataset.page ===
            "accessibility"
        ) {
            showAccessibilityPage("pause");

        if (
            pauseContent.dataset.page ===
            "saveGame"
        ) {

function requestGamePointerLock() {

    try {

        const result =
            renderer.domElement
                .requestPointerLock();

        if (
            result &&
            typeof result.catch ===
                "function"
        ) {

            result.catch(
                error => {

                    console.warn(
                        "Pointer lock failed:",
                        error
                    );

                    showTransientMessage(
                        "Click to look around"
                    );

                }
            );

        }

    } catch (error) {

        console.warn(
            "Pointer lock failed:",
            error
        );

        showTransientMessage(
            "Click to look around"
        );

    }

}

/* =========================================================
SLIDER VISUAL STATE
========================================================= */

function updateSliderVisual(slider) {

    if (!slider) return;

    const min = Number(slider.min);
    const max = Number(slider.max);
    const value = Number(slider.value);

    if (
        !Number.isFinite(min) ||
        !Number.isFinite(max) ||
        !Number.isFinite(value) ||
        max <= min
    ) {
        return;
    }

    const progress =
        ((value - min) / (max - min)) * 100;

    slider.style.setProperty(
        "--slider-progress",
        `${Math.max(0, Math.min(100, progress))}%`
    );
}

function updateAllSliderVisuals() {

    document
        .querySelectorAll(".setting-slider")
        .forEach(updateSliderVisual);
}

/* =========================================================
CONTROL REBINDING
========================================================= */

function setupControlButtons() {

    document
        .querySelectorAll(".control-key")
        .forEach(button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    if (waitingForBindAction) {

                        const previous =
                            document.querySelector(
                                `.control-key[data-action="${waitingForBindAction}"]`
                            );


                        if (previous) {

                            previous.classList.remove(
                                "waiting"
                            );

                            previous.textContent =
                                keyCodeToDisplay(
                                    keybinds[
                                        waitingForBindAction
                                    ]
                                );

                        }

                    }


                    const action =
                        button.dataset.action;


                    waitingForBindAction =
                        action;

                    button.classList.add(
                        "waiting"
                    );

                    button.textContent =
                        "PRESS KEY";

                }
            );

        });

}


/* =========================================================
DROPDOWN
========================================================= */

function setupSingleDropdown(
    dropdown,
    callback
) {

    if (!dropdown) {
        return;
    }


    const button =
        dropdown.querySelector(
            ".dropdown-button"
        );

    const options =
        dropdown.querySelectorAll(
            ".dropdown-option"
        );


    button.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            document
                .querySelectorAll(".custom-dropdown")
                .forEach(other => {

                    if (other !== dropdown) {
                        other.classList.remove("open");
                    }

                });

            dropdown.classList.toggle("open");

        }
    );


    options.forEach(option => {

        option.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                const value =
                    option.dataset.value;

                button.textContent =
                    value === "unlimited"
                        ? "Unlimited"
                        : value;

                dropdown.classList.remove("open");

                callback(value);

            }
        );

    });

}


/* =========================================================
PAUSE SAVE FEEDBACK / COOLDOWN
========================================================= */

let saveCooldownUntil = 0;

let saveCooldownTimer = null;


function getSaveCooldownRemaining() {

    return Math.max(
        0,
        saveCooldownUntil -
            Date.now()
    );

}


function updateSaveButtonCooldown() {

    const button =
        document.getElementById(
            "saveGameButton"
        );

    if (!button) {
        return;
    }


    const remaining =
        getSaveCooldownRemaining();


    if (
        remaining <= 0
    ) {

        button.disabled =
            false;

        button.classList.remove(
            "disabled"
        );

        button.textContent =
            "Save Game";

        if (
            saveCooldownTimer !== null
        ) {

            clearTimeout(
                saveCooldownTimer
            );

            saveCooldownTimer =
                null;

        }

        return;

    }


    button.disabled =
        true;

    button.classList.add(
        "disabled"
    );

    button.textContent =
        "Game Saved";


    if (
        saveCooldownTimer !== null
    ) {

        clearTimeout(
            saveCooldownTimer
        );

    }


    saveCooldownTimer =
        setTimeout(
            updateSaveButtonCooldown,
            remaining
        );

}

========================================================= */

function showPauseSaveGamePage(
    saveAndQuit = false
) {

    pauseContent.dataset.page =
        "saveGame";


    const slots =
        getSaveSlotNumbers();


    pauseContent.innerHTML = `

        <h2 class="pause-title">
            Save Game
        </h2>

        <p class="content-description">
            Choose which save slot to write the current game to.
            Current game: Level ${currentLevel}. Any slot can be used.
        </p>

        <div class="save-slot-list">

            ${slots.map(
                slotNumber => {

                    const record =
                        readSaveSlotRecord(
                            slotNumber
                        );


                    if (
                        record.status ===
                        "unavailable"
                    ) {

                        return `

                            <div
                                class="save-slot unavailable"
                                aria-disabled="true"
                            >

                                <span class="save-slot-title">
                                    Slot ${slotNumber} — Unavailable
                                </span>

                                <span class="save-slot-info">
                                    Save storage could not be read.
                                </span>

                            </div>

                        `;

                    }


                    if (
                        record.status ===
                        "corrupted"
                    ) {

                        return `

                            <button
                                class="save-slot"
                                data-save-slot="${slotNumber}"
                                type="button"
                            >

                                <span class="save-slot-title">
                                    Slot ${slotNumber} — Replace Corrupted Save
                                </span>

                                <span class="save-slot-info">
                                    Current Level ${currentLevel} will replace the corrupted data.
                                </span>

                            </button>

                        `;

                    }


                    if (
                        record.status ===
                        "empty"
                    ) {

                        return `

                            <button
                                class="save-slot"
                                data-save-slot="${slotNumber}"
                                type="button"
                            >

                                <span class="save-slot-title">
                                    Slot ${slotNumber} — Empty
                                </span>

                                <span class="save-slot-info">
                                    Save current Level ${currentLevel} here
                                </span>

                            </button>

                        `;

                    }


                    const savedLevel =
                        normalizeLevelNumber(
                            record.data?.level
                        ) ||
                        "Unknown";


                    return `

                        <button
                            class="save-slot"
                            data-save-slot="${slotNumber}"
                            type="button"
                        >

                            <span class="save-slot-title">
                                Slot ${slotNumber} — Overwrite Level ${savedLevel}
                            </span>

                            <span class="save-slot-info">
                                Save current Level ${currentLevel} here · ${formatSaveDate(
                                    record.data?.savedAt
                                )}
                            </span>

                        </button>

                    `;

                }
            ).join("")}

        </div>


        <button
            class="content-back"
            id="pauseSaveBackButton"
            type="button"
        >
            Back
        </button>

    `;


    pauseContent
        .querySelectorAll(
            ".save-slot[data-save-slot]"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const slotNumber =
                        Number(
                            button.dataset.saveSlot
                        );


                    const record =
                        readSaveSlotRecord(
                            slotNumber
                        );


                    if (
                        record.status === "ok" ||
                        record.status === "corrupted"
                    ) {

                        showPauseSaveOverwriteConfirmPage(
                            slotNumber,
                            saveAndQuit
                        );

                        return;

                    }


                    const saved =
                        saveGame(
                            slotNumber
                        );


                    if (!saved) {

                        showTransientMessage(
                            `Save Failed — Slot ${slotNumber} could not be written`
                        );

                        return;

                    }


                    saveCooldownUntil =
                        Date.now() + 4000;

                    pauseMenuSavedThisSession = true;

                    if (saveAndQuit) {

                        openMainMenu();

                        showTransientMessage(
                            `Game Saved to Slot ${slotNumber}`
                        );

                        return;

                    }

                    showPauseMainPage();

                    showTransientMessage(
                        `Game Saved to Slot ${slotNumber}`
                    );

                }
            );

        });


    document
        .getElementById(
            "pauseSaveBackButton"
        )
        .addEventListener(
            "click",
            saveAndQuit
                ? showPauseQuitConfirmPage
                : showPauseMainPage
        );

}

/* =========================================================
DEBUG OVERLAY
========================================================= */

const debug = {

    enabled: false,

    lastUpdate: 0,

    fps: 0,

    frameCount: 0,

    fpsWindowStart: 0,

    frameTimeMs: 0,

    lastRenderedTimestamp: 0,

    displayIntervalMs: 100,

    fpsSampleWindowMs: 500,


    toggle() {

        this.enabled =
            !this.enabled;

        const overlay =
            document.getElementById(
                "debugOverlay"
            );


        if (overlay) {

            overlay.classList.toggle(
                "visible",
                this.enabled
            );

            overlay.setAttribute(
                "aria-hidden",
                this.enabled
                    ? "false"
                    : "true"
            );

        }


        if (
            this.enabled
        ) {

            this.lastUpdate =
                0;

            updateDebugOverlay(
                true
            );

        }

    }

};


function getHeldKeyLabels() {

    const held = [];


    for (
        const code in keys
    ) {

        if (
            keys[code]
        ) {

            held.push(
                keyCodeToDisplay(code)
            );

        }

    }


    return held.length
        ? held.join(", ")
        : "none";

}


function countSavedSlots() {

    if (
        savedSlotCountCache !== null
    ) {

        return savedSlotCountCache;

    }

    let count = 0;


    for (
        const slotNumber
        of getSaveSlotNumbers()
    ) {

        const record =
            readSaveSlotRecord(
                slotNumber
            );


        if (
            record.status ===
            "ok"
        ) {

            count++;

        }

    }


    savedSlotCountCache =
        count;

    return count;

}


function updateDebugOverlay(
    force = false
) {

    if (
        !debug.enabled
    ) {

        return;

    }


    const now =
        performance.now();


    /*
    Refresh the visible overlay at 10 Hz.
    The game/render loop itself is not throttled by this.
    */
    if (
        !force &&
        debug.lastUpdate !== 0 &&
        now -
            debug.lastUpdate <
            debug.displayIntervalMs
    ) {

        return;

    }


    if (
        debug.fpsWindowStart === 0
    ) {

        debug.fpsWindowStart =
            now;

    }


    const fpsElapsed =
        now -
        debug.fpsWindowStart;


    if (
        fpsElapsed >=
        debug.fpsSampleWindowMs
    ) {

        debug.fps =
            debug.frameCount *
            1000 /
            fpsElapsed;

        debug.frameCount =
            0;

        debug.fpsWindowStart =
            now;

    }


    debug.lastUpdate =
        now;


    const overlay =
        document.getElementById(
            "debugOverlay"
        );


    if (!overlay) {
        return;
    }


    const pointerLocked =
        document.pointerLockElement ===
        renderer.domElement;


    overlay.textContent =
`UNTITLED ${GAME_BUILD}
FPS: ${debug.fps.toFixed(1)}
Frame: ${debug.frameTimeMs.toFixed(2)} ms
Position: ${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}
Yaw: ${yaw.toFixed(3)}  Pitch: ${pitch.toFixed(3)}

Held keys: ${getHeldKeyLabels()}

Pause menu: ${pauseMenuOpen}

Fullscreen: ${Boolean(document.fullscreenElement)}
Fullscreen enabled: ${Boolean(document.fullscreenEnabled)}
Level: ${currentLevel}
Save slots: ${SAVE_SLOT_COUNT} total / ${countSavedSlots()} saved
Renderer calls (last frame): ${renderer.info.render.calls}

Geometries: ${renderer.info.memory.geometries}
Textures: ${renderer.info.memory.textures}
Context lost: ${renderContextLost}`;
}

                    slotNumber,

                cleared:
                    clearSaveSlot(
                        slotNumber
                    )

            });

        }

            safeStorageRemove(
                SAVE_KEY
            );

        const migrationMarkerCleared =
            safeStorageRemove(
                LEGACY_MIGRATION_KEY
            );

        invalidateSavedSlotCountCache();

        if (
            !legacyCleared ||
            !migrationMarkerCleared
        ) {

            showTransientMessage(
                "Save slots cleared, but some storage cleanup failed"
            );

        } else {

            showTransientMessage(
                "All save slots cleared"
            );

        }


        return results;

    },


    validateSave(
        slotNumber
    ) {

        const normalizedSlot =
            Number(
                slotNumber
            );


        const record =
            readSaveSlotRecord(
                normalizedSlot
            );


        if (
            record.status !==
            "ok"
        ) {

            return {
                status:
                    record.status
            };

        }


        const normalized =
            normalizeSaveData(
                record.data,
                normalizedSlot
            );


        return {

            status: "ok",

            repaired:
                normalized.repaired,

            repairCount:
                normalized.repairCount,

            repairs:
                normalized.repairs

        };

    },


    listLevels() {

        return Object
            .entries(levels)
            .map(
                ([number, level]) => ({
                    number:
                        Number(number),

                    name:
                        level.name

                })
            );

    },


    jumpToLevel(
        levelNumber
    ) {

        const normalized =
            normalizeLevelNumber(
                levelNumber
            );


        if (
            normalized === null
        ) {

            return false;

        }


        startLevel(
            normalized
        );

        return true;

    },

        slotNumber
    ) {

        return readSaveSlotRecord(
            Number(
                slotNumber
            )
        );

    }

};

function getActionForKey(code) {

    for (const action in keybinds) {

        if (
            typeof keybinds[action] === "string" &&
            keybinds[action] === code
        ) {

            return action;

        }

    }

    return null;

}


/* =========================================================
KEYBOARD DOWN
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        /* ================================================
        REBINDING
        ================================================ */

        if (waitingForBindAction) {

            event.preventDefault();
            event.stopPropagation();


            const action =
                waitingForBindAction;


            if (
                event.code === "Escape" &&
                action !== "menu"
            ) {

                waitingForBindAction =
                    null;

                clearHeldKeys();

                if (pauseMenuOpen) {

                    showControlsPage("pause");

                } else {

                    showControlsPage("main");

                }

                return;

            }


            const oldCode =
                keybinds[action];


            const existingAction =
                getActionForKey(
                    event.code
                );


            if (
                existingAction === action
            ) {

                waitingForBindAction =
                    null;

                clearHeldKeys();

                if (pauseMenuOpen) {
                    showControlsPage("pause");
                } else {
                    showControlsPage("main");
                }

                return;

            }


            if (existingAction) {

                keybinds[existingAction] =
                    oldCode;

            }


            keybinds[action] =
                event.code;


            console.info(
                "Control rebound:",
                {
                    action,
                    oldCode,
                    newCode:
                        event.code,
                    conflict:
                        existingAction ||
                        null
                }
            );


            waitingForBindAction =
                null;

            clearHeldKeys();


            if (pauseMenuOpen) {
                showControlsPage("pause");
            } else {
                showControlsPage("main");
            }

            return;

        }


        /* ================================================
        MAIN MENU
        ================================================ */

        if (mainMenuOpen) {

            if (
                event.code === "Escape"
            ) {

                enterGame();

            }

            return;

        }


        /* ================================================
        PAUSE MENU
        ================================================ */

        if (pauseMenuOpen) {

            if (
                event.code === keybinds.menu
            ) {

                closePauseMenu();

            }

            return;

        }


        /* ================================================
        GAME MENU
        ================================================ */

        if (
            event.code === keybinds.menu
        ) {

            openPauseMenu();

            return;

        }


        /* ================================================
        LEAN TOGGLE

        Sprint and lean are mutually exclusive.
        ================================================ */

        if (
            isSprintActive()
        ) {

            leanToggleLeft = false;
            leanToggleRight = false;

        } else if (
            leanMode === "toggle" &&
            event.code === keybinds.leanLeft &&
            !event.repeat
        ) {

            leanToggleLeft =
                !leanToggleLeft;

            if (leanToggleLeft) {
                leanToggleRight = false;
            }

            return;

        }


        if (
            leanMode === "toggle" &&
            event.code === keybinds.leanRight &&
            !event.repeat
        ) {

            leanToggleRight =
                !leanToggleRight;

            if (leanToggleRight) {
                leanToggleLeft = false;
            }

            return;

        }


        /* ================================================
        WORKING LEVEL 1 DOOR
        ================================================ */

        // E is reserved for Lean Right; the prototype door uses F.
        if (
            event.code === "KeyF" &&
            !event.repeat
        ) {

            toggleNearestWorkingDoor();

            return;

        }


        /* ================================================
        SPRINT

        Sprint overrides crouch. Starting a sprint also clears
        any lean so sprinting and leaning cannot coexist.
        ================================================ */

        if (
            event.code === keybinds.sprint &&
            !event.repeat
        ) {

            if (sprintMode === "toggle") {

                sprintToggleState =
                    !sprintToggleState;

                if (sprintToggleState) {

                    crouchToggleState = false;
                    leanToggleLeft = false;
                    leanToggleRight = false;

                    clearLeanVisualOffset();

                    currentLean = 0;
                    leanAnimationFrom = 0;
                    leanAnimationTarget = 0;
                    leanAnimationElapsed = 0;

                }

                return;

            }

            crouchToggleState = false;
            leanToggleLeft = false;
            leanToggleRight = false;

            clearLeanVisualOffset();

            currentLean = 0;
            leanAnimationFrom = 0;
            leanAnimationTarget = 0;
            leanAnimationElapsed = 0;

        }


        /* ================================================
        CROUCH TOGGLE
        ================================================ */

        if (
            crouchMode === "toggle" &&
            event.code === keybinds.crouch &&
            !event.repeat
        ) {

            crouchToggleState =
                !crouchToggleState;

            return;

        }


        /* ================================================
        SLOW WALK TOGGLE
        ================================================ */

        if (
            slowWalkMode === "toggle" &&
            event.code === keybinds.slowWalk &&
            !event.repeat
        ) {

            slowWalkToggleState =
                !slowWalkToggleState;

            return;

        }


        /* ================================================
        GAMEPLAY
        ================================================ */

        keys[event.code] =
            true;

    }
);
